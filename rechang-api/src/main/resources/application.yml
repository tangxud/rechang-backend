server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    # 环境切换：dev(本地) / test / prod，详见 docs/design/environment_config.md
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    # API JSON 属性统一 camelCase（与 API 契约一致）；DB 列名 snake_case 由 MyBatis-Plus 下划线映射承担

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-underline: true

# 签名密钥：由 AppSecretConfig 在启动时注入。
# dev 用内置默认值；test/prod 必须以环境变量提供（对应 profile 已去除空值占位），规范见 environment_config.md
jwt:
  secret: ${JWT_SECRET:}
qr:
  hmac-secret: ${QR_HMAC_SECRET:}

# 微信小程序凭据：dev 走 WechatLoginMock 无需提供；
# test/prod 必须以环境变量提供（对应 profile 已去除空值占位），缺失即启动失败
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}

# 微信支付（票 #30005）：配置 wechat-pay.mchid 即启用 v3 真实网关（其余凭据必须齐全，缺失启动失败）；
# 未配置时回落 Mock 网关（支付即成功）——本地/无商户号场景；prod 缺失直接启动失败，禁止生产 Mock 收单
wechat-pay:
  mchid: ${WECHAT_PAY_MCHID:}
  api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
  merchant-serial-no: ${WECHAT_PAY_MERCHANT_SERIAL_NO:}
  merchant-private-key: ${WECHAT_PAY_MERCHANT_PRIVATE_KEY:}
  platform-public-key: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY:}
  notify-url: ${WECHAT_PAY_NOTIFY_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
