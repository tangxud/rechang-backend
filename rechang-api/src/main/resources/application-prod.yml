# ===== 生产环境 =====
# 所有敏感项必须由部署系统从 KMS/配置中心读取后注入环境变量（见 environment_spec.md §8.6），
# 此处不提供任何默认值，缺失即启动失败。

spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}

jwt:
  secret: ${JWT_SECRET}             # >= 32 字节强随机串，季度轮换
qr:
  hmac-secret: ${QR_HMAC_SECRET}    # 与闸机侧约定一致，轮换走 ticket_hmac_key:vN 双活窗口
wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}          # 小程序后台生成，泄露即重置；轮换仅需重启生效

logging:
  level:
    root: warn
    com.rechang: info

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

management:
  endpoints:
    web:
      exposure:
        include: health

